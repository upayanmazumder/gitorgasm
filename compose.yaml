# Local stack uses .env.local. Container URLs override host database settings.
name: gitorgasm

x-core: &core
  build:
    context: core
  env_file:
    - path: .env.local
      required: true
  environment:
    DATABASE_URL: postgres://gitorgasm:gitorgasm@postgres:5432/gitorgasm?sslmode=disable
    HTTP_ADDR: ':8080'
    METRICS_ADDR: ':9090'

services:
  postgres:
    image: postgres:18-alpine
    # Extra connections accommodate parallel test databases.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - idle_in_transaction_session_timeout=5min
    environment:
      POSTGRES_USER: gitorgasm
      POSTGRES_PASSWORD: gitorgasm
      POSTGRES_DB: gitorgasm
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gitorgasm -d gitorgasm']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *core
    command: ['migrate']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *core
    command: ['api']
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:9090:9090'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *core
    profiles: ['github']
    command: ['worker']
    ports:
      - '127.0.0.1:9091:9090'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
