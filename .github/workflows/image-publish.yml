name: Image publish

# The only workflow that pushes to GHCR. It runs for a push to main and nothing else.
# `environment` is set here because a job that calls a reusable workflow cannot set it.
# The environment's deployment branch rule (main only) is a GitHub setting, see
# docs/architecture/image-publish-gate.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    # The github context is the caller's. A run that is not a push to main skips this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-publish
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signature, bound to this workflow and ref
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/core
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Sign the pushed digest. The certificate names this workflow file and refs/heads/main.
      # The cluster policy accepts only that identity.
      - name: Sign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/core
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # policy-controller verifies cosign v3 bundles as attestations, not image signatures.
      - name: Attest image publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}/core
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          jq -n \
            --arg repository "$REPOSITORY" --arg commit "$COMMIT" \
            --arg ref "$REF" --arg digest "$DIGEST" \
            '{repository: $repository, commit: $commit, ref: $ref, digest: $digest}' \
            > publication.json
          cosign attest --yes \
            --type https://gitorgasm.upayan.dev/attestations/image-publish/v1 \
            --predicate publication.json "${IMAGE}@${DIGEST}"
