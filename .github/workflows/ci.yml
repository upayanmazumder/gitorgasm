name: CI

# Filter by job so the required CI check still reports when paths are skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      core: ${{ steps.filter.outputs.core == 'true' || github.event_name == 'workflow_dispatch' }}
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
      scoring: ${{ steps.filter.outputs.scoring == 'true' || github.event_name == 'workflow_dispatch' }}
      bench: ${{ steps.filter.outputs.bench == 'true' || github.event_name == 'workflow_dispatch' }}
      manifests: ${{ steps.filter.outputs.manifests == 'true' || github.event_name == 'workflow_dispatch' }}
      tooling: ${{ steps.filter.outputs.tooling == 'true' || github.event_name == 'workflow_dispatch' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            core:
              - .github/workflows/ci.yml
              - .github/workflows/core.yml
              - .github/workflows/image.yml
              - core/**
              - contracts/**
              - scoring/**
            web:
              - .github/workflows/ci.yml
              - .github/workflows/web.yml
              - web/**
            scoring:
              - .github/workflows/ci.yml
              - .github/workflows/scoring.yml
              - scoring/**
            bench:
              - .github/workflows/ci.yml
              - .github/workflows/bench.yml
              - tests/performance/lang-bench/**
            manifests:
              - .github/workflows/ci.yml
              - .github/workflows/manifests.yml
              - deploy/**
            tooling:
              - .github/workflows/ci.yml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .lintstagedrc.mjs
              - commitlint.config.mjs
              - .husky/**
            workflows:
              - .github/workflows/**

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commitlint needs the PR range
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  tooling:
    name: Root tooling (audit)
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  core:
    name: Core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  scoring:
    name: Scoring
    needs: changes
    if: needs.changes.outputs.scoring == 'true'
    uses: ./.github/workflows/scoring.yml

  bench:
    name: Bench
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    uses: ./.github/workflows/bench.yml

  manifests:
    name: Manifests
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    uses: ./.github/workflows/manifests.yml

  image:
    name: Image
    needs: [changes, core]
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
      packages: write # push to GHCR on main only
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  ci:
    name: CI
    if: always()
    needs: [changes, commits, tooling, workflows, core, web, scoring, bench, manifests, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any stage failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
      - run: echo "All required stages passed or were skipped."
