openapi: 3.0.3
info:
  title: Gitorgasm API
  version: 1.0.0
  description: |
    Public API of the Gitorgasm core service. The frontend calls it through a same-origin
    proxy (`/api/*` on Vercel), so session cookies are first-party.

    Rules:
    - Every error uses the `Error` schema.
    - Lists use an opaque `cursor`; stored lists use keysets and live GitHub directories use bounded upstream pages. `next_cursor` is null on the last supported page.
    - State-changing requests must send an `Origin` header that equals the frontend origin.
    - Organizations the caller cannot access return 404, not 403.
    - Access to an organization requires an active GitHub organization membership (or ownership of a personal account). A session re-confirms this with GitHub when the last confirmation is older than 15 minutes. Any authenticated request can then return 503 `github_unavailable` or `github_rate_limited` (with `Retry-After`) when GitHub cannot confirm it, or 401 `github_reauthentication_required` when the stored GitHub token is expired or rejected; sign in again through `/v1/auth/login`.
servers:
  - url: /
security:
  - session: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /readyz:
    get:
      summary: Readiness probe. Ready only when PostgreSQL answers.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /v1/auth/login:
    get:
      summary: Start GitHub App sign-in or refresh installation grants (state and PKCE)
      description: |
        Browser navigation endpoint, also used as the GitHub App Setup URL after installation.
        Always starts fresh OAuth state and PKCE. Incoming installation_id, setup_action,
        state, and redirect targets are ignored; they never grant access.
      security: []
      responses:
        '302': { description: Redirect to GitHub }
        '503': { $ref: '#/components/responses/Error' }
  /v1/auth/callback:
    get:
      summary: GitHub OAuth callback
      security: []
      description: |
        Requires matching browser-bound OAuth state and a nonempty PKCE verifier.
        Exchanges the code for a fresh user token, replaces the user's grants only with
        all pages of GET /user/installations, and creates a session transactionally with sync jobs.
        Success redirects to the fixed APP_ORIGIN/organizations; no caller-supplied redirect
        or installation_id is trusted. Failures return the Error schema, not a redirect.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: GitHub authorization denial; always rejected even if a code is present }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '302': { description: Session created and grants refreshed; redirect to APP_ORIGIN/organizations }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/auth/install:
    get:
      summary: Redirect to the GitHub App installation page
      security: []
      description: |
        Starts installation on GitHub, without granting local access. Configure the GitHub
        App Setup URL to the frontend /api/v1/auth/login, enable Redirect on update, and
        disable Request user authorization (OAuth) during installation so Gitorgasm
        initiates its own state- and PKCE-protected OAuth flow on return.
      responses:
        '302': { description: Redirect to GitHub }
        '503': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      summary: End the current session
      description: |
        Idempotently deletes the current session and clears the session and pending OAuth
        cookies. Requires the frontend Origin header even if no session exists.
      security: []
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      summary: Current user
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/organizations:
    get:
      summary: Organizations the caller can access through a Gitorgasm installation
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Organizations ordered by login
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/repositories:
    get:
      summary: Repositories of an organization, ordered by name
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: One page of repositories
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Repository' }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/sync:
    post:
      summary: Queue a repository sync. Pending syncs for the same organization are deduplicated.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '202':
          description: Sync queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, duplicate]
                additionalProperties: false
                properties:
                  job_id: { type: integer, format: int64 }
                  duplicate: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/scores:
    get:
      summary: Get the latest daily organization scores and their freshness.
      description: |
        `fresh` is false when the last ingest failed, scoring has not caught up, or the data
        is older than 24 hours. 503 `scores_pending` means no scores exist yet.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Stored scores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scores' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/scores/query:
    post:
      summary: Score an organization with a time period, filters, and rules.
      description: |
        A named period without `as_of` resolves against the latest ingest time. Results are
        cached per data generation and query. 503 `scores_pending` means the current data is
        not scored yet; 503 `scores_busy` means no scorer slot became free in time. A user or an organization
        never holds more than one of the two slots, so a caller can also get `scores_busy` while its
        own earlier request is still running.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreQuery' }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Scores for the requested options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scores' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/scores/presets:
    get:
      summary: List saved scoring options for an organization.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Saved scoring options, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScorePreset' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/scores/presets/{name}:
    put:
      summary: Save scoring options for an organization (at most 50 presets).
      description: The name is trimmed. A named period is stored without `as_of`.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreQuery' }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          description: Saved options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScorePreset' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove saved scoring options. The name is trimmed.
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
    get:
      operationId: administrationCapabilities
      summary: Check live organization owner and GitHub App Members write capability
      description: |
        Resolves the caller's current installation grant before any GitHub request.
        Uses the exact session's GitHub App user token and live organization membership.
        Non-owners or missing Members write permission receive can_manage=false, not a
        fabricated success for expired tokens or GitHub outages. Reauthenticate through
        /v1/auth/login when github_reauthentication_required is returned.
      responses:
        '200':
          description: Live capability, including the signed-in GitHub actor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdministrationCapability' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration/users:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
    get:
      operationId: searchAdministrationUsers
      summary: Search one bounded page of public GitHub users
      description: |
        Requires live owner capability. The upstream public search request sends no
        authentication. Input is lowercased and spaces collapsed; a fixed type:user
        restriction is appended. Cursors are bound to actor, organization and normalized
        query. No caller-provided GitHub URL is accepted.
        Results are cached for 45 seconds by normalized query and page. Uncached searches
        spend the shared unauthenticated GitHub quota, so each actor may make 4 and each
        installation 6 per minute; beyond that the response is 429 search_rate_limited
        with Retry-After.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64, pattern: '^[A-Za-z0-9_ -]+$' }
        - { $ref: '#/components/parameters/AdministrationCursor' }
      responses:
        '200':
          description: Public users; incomplete_results is preserved from GitHub
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationSearchPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration/teams:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
    get:
      operationId: listAdministrationTeams
      summary: List one page of existing teams using the owner's user token
      description: Requires live owner capability; team descriptions and privacy metadata are not returned.
      parameters:
        - { $ref: '#/components/parameters/AdministrationCursor' }
      responses:
        '200':
          description: Team identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationTeamPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration/members:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
    get:
      operationId: listAdministrationMembers
      summary: List one live page of current organization members
      description: |
        Requires live owner capability. The role filter maps to GitHub's role parameter;
        admin means organization Owner. Individual rows do not claim a role.
        Cursors are bound to actor, organization, resource and role.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [all, member, admin], default: all } }
        - { $ref: '#/components/parameters/AdministrationCursor' }
      responses:
        '200':
          description: Current member identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationUserPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration/operations:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
    get:
      operationId: listAdministrationOperations
      summary: List the current actor's ten most recent administration receipts
      description: |
        Requires a current installation grant and live owner capability. Strict keyset
        pagination is scoped to the actor and organization. Summaries omit target results.
        Interrupted job states are projected without modifying durable state.
      parameters:
        - { $ref: '#/components/parameters/AdministrationCursor' }
      responses:
        '200':
          description: Actor-only receipt history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationOperationPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: submitAdministrationOperation
      summary: Enqueue an explicitly reviewed administration batch
      description: |
        Requires the same-origin Origin header, a current grant, a usable session-bound
        GitHub user token, live organization Owner membership and App Members write.
        Maximum JSON body size is 16 KiB. Unknown fields, trailing JSON and invalid
        field combinations are rejected before GitHub authorization requests.
        Trim usernames, remove one leading @, deduplicate case-insensitively in input
        order, and accept at most 50 unique safe usernames. Managed-user underscores
        are supported. Explicit member role for invite/team is equivalent to omission.
        Team existence is checked before enqueue; missing teams return 422.
        Operation, targets, River job and audit event commit in one transaction.
        The same actor/organization/key and canonical payload returns the same receipt
        without another job. Changed payload returns 409. No automatic mutation retry.
        An actor may have at most 3, and an installation at most 5, queued or running
        operations; further new submissions return 429 too_many_operations with
        Retry-After. Replays of an existing key are unaffected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: Opaque UUID, case-insensitive; keep stable after an uncertain response.
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
          description: Must equal the configured frontend origin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrationRequest' }
      responses:
        '202':
          description: Queued/running receipt, including an idempotent active replay
          headers:
            Location:
              description: Relative URL of this actor's operation receipt
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationOperationResponse' }
        '200':
          description: Idempotent replay of a completed or interrupted receipt
          headers:
            Location:
              description: Relative URL of this actor's operation receipt
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationOperationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/organizations/{login}/administration/operations/{id}:
    parameters:
      - { $ref: '#/components/parameters/AdministrationOrganization' }
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
    get:
      operationId: getAdministrationOperation
      summary: Read an actor-only durable operation receipt
      description: |
        Requires the current installation grant, live owner capability and original
        actor. Cross-actor and cross-tenant receipts return 404. Missing/terminal River
        jobs or attempts older than 30 minutes project an interrupted terminal receipt:
        running targets become unknown/outcome_unknown, queued targets become
        not_attempted/interrupted, completed results remain intact. GET never writes.
      responses:
        '200':
          description: Durable results or a derived interrupted view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrationOperationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /webhooks/github:
    post:
      summary: GitHub App webhook receiver (HMAC-SHA256 signed)
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '202':
          description: Stored for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate]
                properties:
                  accepted: { type: boolean }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            Both intake slots are busy (`busy`; GitHub redelivers) or the GitHub App is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    AdministrationOrganization:
      name: login
      in: path
      required: true
      schema: { type: string }
      description: Organization login, resolved case-insensitively through the caller's current installation grants.
    AdministrationCursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: Opaque next_cursor from this actor, organization, resource and filter; arbitrary upstream URLs are invalid.
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-gitorgasm_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    AdministrationCapability:
      type: object
      additionalProperties: false
      required: [organization, actor, can_manage, reason, max_batch_size]
      properties:
        organization: { type: string }
        actor:
          type: object
          additionalProperties: false
          required: [github_id, login]
          properties:
            github_id: { type: integer, format: int64 }
            login: { type: string }
        can_manage: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [not_owner, members_permission_required, unsupported_account, installation_suspended, null]
        max_batch_size: { type: integer, enum: [50] }
    AdministrationDirectoryUser:
      type: object
      additionalProperties: false
      required: [id, login]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
    AdministrationDirectoryTeam:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
    AdministrationUserPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdministrationDirectoryUser' }
        next_cursor: { type: string, nullable: true }
    AdministrationSearchPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor, incomplete_results]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdministrationDirectoryUser' }
        next_cursor: { type: string, nullable: true }
        incomplete_results: { type: boolean }
    AdministrationTeamPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdministrationDirectoryTeam' }
        next_cursor: { type: string, nullable: true }
    AdministrationLogin:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$'
      description: Canonical safe username after trimming whitespace and removing one leading @.
    AdministrationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, logins]
          properties:
            kind: { type: string, enum: [invite] }
            logins: { $ref: '#/components/schemas/AdministrationLogins' }
            role: { type: string, enum: [member] }
        - type: object
          additionalProperties: false
          required: [kind, logins, team_slug]
          properties:
            kind: { type: string, enum: [team_membership] }
            logins: { $ref: '#/components/schemas/AdministrationLogins' }
            team_slug: { type: string, description: 'Trimmed and lowercased before validation against ^[a-z0-9][a-z0-9_-]{0,99}$.' }
            role: { type: string, enum: [member] }
        - type: object
          additionalProperties: false
          required: [kind, logins, role]
          properties:
            kind: { type: string, enum: [organization_role] }
            logins: { $ref: '#/components/schemas/AdministrationLogins' }
            role: { type: string, enum: [member, admin], description: admin grants full organization Owner authority. }
    AdministrationLogins:
      type: array
      minItems: 1
      description: At most 50 unique canonical usernames after case-insensitive deduplication; body remains bounded to 16 KiB.
      items:
        type: string
        description: Trimmed, optional one leading @ removed, then validated as AdministrationLogin.
    AdministrationOperationSummary:
      type: object
      required: [id, kind, status, team_slug, role, target_count, created_at, completed_at]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        kind: { type: string, enum: [invite, team_membership, organization_role] }
        status: { type: string, enum: [queued, running, completed, interrupted] }
        team_slug: { type: string, nullable: true }
        role: { type: string, enum: [member, admin, null], nullable: true }
        target_count: { type: integer, minimum: 1, maximum: 50 }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    AdministrationTargetResult:
      type: object
      additionalProperties: false
      required: [login, status, code, message]
      properties:
        login: { $ref: '#/components/schemas/AdministrationLogin' }
        status: { type: string, enum: [queued, running, succeeded, invited, unchanged, failed, unknown, not_attempted] }
        code: { type: string, nullable: true, description: Stable outcome code; never an upstream error body. }
        message: { type: string, nullable: true, description: Fixed safe product copy; unknown means check GitHub before retrying. }
    AdministrationOperation:
      allOf:
        - { $ref: '#/components/schemas/AdministrationOperationSummary' }
        - type: object
          required: [results]
          properties:
            results:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/AdministrationTargetResult' }
    AdministrationOperationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AdministrationOperation' }
    AdministrationOperationPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AdministrationOperationSummary' }
        next_cursor: { type: string, nullable: true }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
        database: { type: string }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { type: string, description: Stable machine-readable code }
            message: { type: string }
            request_id: { type: string }
    User:
      type: object
      required: [github_id, login, name, avatar_url]
      additionalProperties: false
      properties:
        github_id: { type: integer, format: int64 }
        login: { type: string }
        name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
    Organization:
      type: object
      required:
        [
          login,
          github_id,
          type,
          avatar_url,
          installation_id,
          repository_selection,
          suspended,
          repository_count,
          last_synced_at,
        ]
      additionalProperties: false
      properties:
        login: { type: string }
        github_id: { type: integer, format: int64 }
        type: { type: string, enum: [Organization, User, Enterprise] }
        avatar_url: { type: string, nullable: true }
        installation_id: { type: integer, format: int64 }
        repository_selection: { type: string, enum: [all, selected] }
        suspended: { type: boolean }
        repository_count: { type: integer, format: int64 }
        last_synced_at: { type: string, format: date-time, nullable: true }
    Repository:
      type: object
      required:
        [
          github_id,
          name,
          full_name,
          description,
          private,
          fork,
          archived,
          visibility,
          default_branch,
          language,
          stargazers,
          pushed_at,
          synced_at,
        ]
      additionalProperties: false
      properties:
        github_id: { type: integer, format: int64 }
        name: { type: string }
        full_name: { type: string }
        description: { type: string, nullable: true }
        private: { type: boolean }
        fork: { type: boolean }
        archived: { type: boolean }
        visibility: { type: string, nullable: true }
        default_branch: { type: string, nullable: true }
        language: { type: string, nullable: true }
        stargazers: { type: integer }
        pushed_at: { type: string, format: date-time, nullable: true }
        synced_at: { type: string, format: date-time }
    ScoreQuery:
      type: object
      additionalProperties: false
      properties:
        period:
          type: object
          description: |
            All time, a custom range (start inclusive, end exclusive), or a named UTC period.
            Named periods use as_of as the exclusive end; the server fills it in when absent.
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [all, custom, preset] }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            preset: { type: string, enum: [today, this_week, this_month, last7_days, last30_days] }
            as_of: { type: string, format: date-time }
        filter:
          type: object
          additionalProperties: false
          properties:
            preset: { type: string, enum: [all, code, reviews, issues] }
            users: { type: array, items: { type: integer, format: int64 } }
            repositories: { type: array, items: { type: string } }
            kinds:
              type: array
              items: { type: string, enum: [commit, pr_open, pr_merge, review, issue_open, issue_close] }
            excludeBots: { type: boolean }
            search: { type: string, nullable: true }
        rules:
          type: object
          description: A complete custom scoring ruleset.
    ScorePreset:
      type: object
      required: [name, query]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        query: { $ref: '#/components/schemas/ScoreQuery' }
    ScoreRow:
      type: object
      required: [score, counts, breakdown, rank]
      properties:
        userId: { type: integer, format: int64 }
        userLogin: { type: string }
        repoName: { type: string }
        score: { type: number }
        rank: { type: integer }
        breakdown: { type: object }
        counts: { type: object }
    Scores:
      type: object
      required: [data, state, fresh]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [contributors, repositories, teams]
          properties:
            contributors: { type: array, items: { $ref: '#/components/schemas/ScoreRow' } }
            repositories: { type: array, items: { $ref: '#/components/schemas/ScoreRow' } }
            teams: { type: array, items: { $ref: '#/components/schemas/ScoreRow' } }
        state:
          type: object
          additionalProperties: false
          required: [generation, scored_generation, last_ingested_at, last_scored_at, ingestion_failed]
          properties:
            generation: { type: integer, format: int64 }
            scored_generation: { type: integer, format: int64 }
            last_ingested_at: { type: string, format: date-time, nullable: true }
            last_scored_at: { type: string, format: date-time, nullable: true }
            ingestion_failed: { type: boolean }
        fresh: { type: boolean }
