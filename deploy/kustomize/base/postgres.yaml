# Replicas cannot add availability on one node. Restic backs up PostgreSQL data.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Match the digest-normalized admission result to prevent Argo CD reconciliation drift.
          image: index.docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          args:
            - -c
            - shared_buffers=64MB
            - -c
            # Allow rollout pools, migrations, backups, and admin connections.
            - max_connections=60
            - -c
            - work_mem=4MB
            - -c
            - log_min_duration_statement=500ms
            - -c
            - log_lock_waits=on
            # Backstop sessions without the application's 30-second idle transaction limit.
            - -c
            - idle_in_transaction_session_timeout=5min
          env:
            - name: POSTGRES_DB
              value: gitorgasm
            - name: POSTGRES_USER
              value: gitorgasm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitorgasm-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # Allow initialization and recovery before liveness checks begin.
          startupProbe:
            exec:
              command: ['pg_isready', '-U', 'gitorgasm', '-d', 'gitorgasm']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'gitorgasm', '-d', 'gitorgasm']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'gitorgasm', '-d', 'gitorgasm']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
