apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secrets come from deploy/argocd, which only Argo CD can render.
namespace: gitorgasm
labels:
  - pairs:
      app.kubernetes.io/part-of: gitorgasm
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: gitorgasm-core
    envs: [config.env]
# Argo CD Image Updater sets the digest of `latest` as an Application override.
images:
  - name: gitorgasm-core
    newName: ghcr.io/upayanmazumder/gitorgasm/core
    newTag: latest
