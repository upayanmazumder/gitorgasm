apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Secrets come from the cluster repository, not this base.
namespace: gitorgasm
labels:
  - pairs:
      app.kubernetes.io/part-of: gitorgasm
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: gitorgasm-core
    envs: [config.env]
# The cluster repository replaces this tag with an immutable sha-<commit> tag.
images:
  - name: gitorgasm-core
    newName: ghcr.io/upayanmazumder/gitorgasm/core
    newTag: latest
