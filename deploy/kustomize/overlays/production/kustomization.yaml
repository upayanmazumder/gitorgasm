apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# deploy/argocd adds the encrypted Secrets to this overlay. CI validates this tree.
namespace: gitorgasm
labels:
  - pairs:
      app.kubernetes.io/part-of: gitorgasm
    includeSelectors: false
resources:
  - ../../base
  - ingress.yaml
  - persistentvolume.yaml
configMapGenerator:
  - name: gitorgasm-core
    behavior: merge
    envs: [config.env]
patches:
  - path: pin-node.yaml
    target:
      kind: Deployment
  - path: pin-node.yaml
    target:
      kind: StatefulSet
  - path: postgres-volume.yaml
