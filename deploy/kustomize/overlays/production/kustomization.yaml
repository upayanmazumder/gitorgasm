apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production on the single-node k3s cluster (node `vps`). The cluster repo adds the
# SOPS-encrypted Secrets `gitorgasm-core` and `gitorgasm-postgres` next to this overlay.
resources:
  - ../../base
  - ingress.yaml
  - persistentvolume.yaml
patches:
  - path: pin-node.yaml
    target:
      kind: Deployment
  - path: pin-node.yaml
    target:
      kind: StatefulSet
  - path: postgres-volume.yaml
  - path: config.yaml
