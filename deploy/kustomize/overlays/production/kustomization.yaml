apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The cluster repository supplies the encrypted Secrets for this overlay.
resources:
  - ../../base
  - ingress.yaml
  - persistentvolume.yaml
configMapGenerator:
  - name: gitorgasm-core
    behavior: merge
    envs: [config.env]
patches:
  - path: pin-node.yaml
    target:
      kind: Deployment
  - path: pin-node.yaml
    target:
      kind: StatefulSet
  - path: postgres-volume.yaml
