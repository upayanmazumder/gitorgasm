[package]
name = "gitorgasm-scoring"
version = "0.1.0"
description = "Organization-scoped contribution scoring engine"
license = "MIT"
publish = false
rust-version = "1.88"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
